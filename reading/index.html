<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7f5fb" data-light="#f7f5fb" data-dark="#15121f" />
  <meta name="description" content="翻頁之後的專案點子本。記下方向與靈感，慢慢整理成下一個生活練習作品。" />
  <title>翻頁之後・專案點子本｜生活實驗室</title>
  <script src="../assets/theme.js"></script>
  <script type="module" src="../assets/planner.mjs"></script>
  <link rel="stylesheet" href="../assets/lab.css" />
</head>
<body>
  <a class="skip-link" href="#main">跳到主要內容</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="../" aria-label="生活實驗室首頁">
        <span class="brand-icon"><svg aria-hidden="true"><use href="../assets/icons.svg#flask" /></svg><i></i></span>
        <span>生活<span class="brand-accent">實驗室</span></span>
      </a>
      <nav class="header-actions" aria-label="網站導覽">
        <a class="explore-link" href="../#works">探索作品 <span aria-hidden="true">↘</span></a>
        <button class="theme-button" type="button" data-theme-toggle aria-label="切換至暗色模式" aria-pressed="false">
          <svg aria-hidden="true" data-theme-icon="moon"><use href="../assets/icons.svg#moon" /></svg>
          <svg aria-hidden="true" data-theme-icon="sun" hidden><use href="../assets/icons.svg#sun" /></svg>
          <span data-theme-label>暗色</span>
        </button>
      </nav>
    </div>
  </header>
  <main id="main" class="site-main project-main">
    <a class="breadcrumb" href="../#works">← 回到所有練習作品</a>
    <article class="project-intro planner-intro reading-card" aria-labelledby="project-title">
      <div class="planner-top">
        <span class="work-icon"><svg aria-hidden="true"><use href="../assets/icons.svg#reading" /></svg></span>
        <div class="planner-heading"><span class="project-status"><i aria-hidden="true"></i>規劃中的練習作品</span><h1 id="project-title">翻頁之後</h1></div>
      </div>
      <p class="project-lead">把書裡的啟發留在生活裡，記下讀後的感受、想法與收穫。</p>
      <form class="notebook" data-project="reading" data-project-title="翻頁之後" aria-labelledby="notebook-title">
        <div class="notebook-heading"><h2 id="notebook-title">專案點子本</h2><p>先留住想法，之後再慢慢整理。</p></div>
        <div class="notebook-fields">
          <div class="notebook-field">
            <label for="planDirection"><span class="field-index" aria-hidden="true">01</span>方向與目標</label>
            <p class="field-hint" id="directionHint">想往哪裡走？這個作品想完成什麼？</p>
            <textarea id="planDirection" name="direction" rows="9" aria-describedby="directionHint" placeholder="例如：想怎麼整理讀書心得？希望留下哪些讀後感受，或實際用在生活裡的想法？" disabled></textarea>
          </div>
          <div class="notebook-field">
            <label for="planIdeas"><span class="field-index" aria-hidden="true">02</span>點子與靈感</label>
            <p class="field-hint" id="ideasHint">不必想完整，想到什麼就先寫下來。</p>
            <textarea id="planIdeas" name="ideas" rows="9" aria-describedby="ideasHint" placeholder="想讀的書、想寫的心得、打動自己的段落、閱讀時冒出的問題……
先把想法留在這裡。" disabled></textarea>
          </div>
        </div>
        <div class="notebook-toolbar">
          <button class="note-button note-save" type="submit" disabled>儲存筆記</button>
          <button class="note-button" type="button" id="downloadNotes" disabled>下載備份</button>
          <p class="save-status" id="saveStatus" role="status" aria-live="polite">正在開啟點子本…</p>
        </div>
        <p class="notebook-storage">輸入後會自動儲存，每個專案分開記錄。筆記只存在目前瀏覽器，不會跨裝置同步；可以下載備份保留內容。</p>
        <noscript><p class="notebook-noscript">請啟用 JavaScript，才能編輯與儲存點子筆記。</p></noscript>
      </form>
    </article>
  </main>
  <footer class="site-footer"><a href="../">生活實驗室 <span>LIFE LAB</span></a><p>這裡的作品皆為練習作品。</p></footer>
</body>
</html>
